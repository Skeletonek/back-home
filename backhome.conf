# backup-entries — gitignore-style list of files/dirs to back up
#
# Lines starting with '!' EXCLUDE (negative entries, take precedence).
# Lines starting with '#' are comments. Blank lines are ignored.
# Include patterns may be literal paths or glob patterns (support *, ?, [...], **).
#
# Relative paths are resolved against $HOME.
# Absolute paths start with '/'.

# --- include ---
.config
.bashrc
.bash_profile
.profile
.zshrc
.zprofile
.gitconfig
.vimrc
.editorconfig
.local/share
.gnupg
.ssh
.npmrc
.cargo/config.toml
.mozilla
.icons
.themes
fonts.conf

# --- exclude caches / junk (negative entries) ---
!.config/**/Cache
!.config/**/cache
!.config/**/*.log
!.local/share/Trash
!.cache/**
!.npm/_logs
!.ssh/known_hosts
