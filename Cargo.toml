[package]
name = "BackHome"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "BackHome"
path = "src/main.rs"

[dependencies]
tar = "0.4"
zstd = "0.13"
globset = "0.4"
glob = "0.3"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
